name: Автоматическая сборка релизов Freddy Fazbear (APK и EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_PYTHON: "3.11"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    name: Сборка ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            artifact_path: dist/freddy-fazbear-windows.exe

          - name: apk
            runner: ubuntu-latest
            artifact_path: build/freddy-fazbear-android.apk

    steps:
      - uses: actions/checkout@v4

      - name: Настройка Java (только для Android)
        if: matrix.name == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка uv
        uses: astral-sh/setup-uv@v6

      - name: Сборка Windows (PyInstaller)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          # Собираем бинарник из корня репозитория
          uv run --with "flet[desktop]" --with pandas --with openpyxl --with pillow --with requests --with fpdf2 --with "pyinstaller==6.3.0" pyinstaller --noconsole --onefile --collect-all flet --collect-all flet_desktop --name "freddy-fazbear-windows" freddy_fazbear_mobile.py

      - name: Сборка Android (Flet CLI)
        if: matrix.name == 'apk'
        shell: bash
        run: |
          # Сборка APK из корня репозитория (.)
          uv run --with flet --with requests --with openpyxl --with fpdf2 flet build apk . -o build/apk --yes --verbose

      - name: Переименование APK
        if: matrix.name == 'apk'
        shell: bash
        run: |
          mv build/apk/*.apk build/freddy-fazbear-android.apk

      - name: Сохранение артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Скачивание всех сборок
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifact'
          merge-multiple: true

      - name: Публикация релиза на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            freddy-fazbear-windows.exe
            freddy-fazbear-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}